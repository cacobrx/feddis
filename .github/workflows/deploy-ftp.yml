# Compila el frontend y publica la app por FTP en cada push a main.
# Producción: https://feddis.planbsistemas.com.ar (la app va en la raíz del subdominio, la API en /api).
# Secrets requeridos: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD.
# Variables opcionales: FTP_DIR (carpeta destino), FTP_PROTOCOL (ftp | ftps), API_PATH.
name: Deploy FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ftp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Compilar frontend
        working-directory: frontend
        env:
          VITE_API: ${{ vars.API_PATH || '/api/index.php' }}
        run: |
          npm ci
          npm run build

      - name: Armar carpeta de publicación
        run: |
          mkdir deploy
          cp -r app/. deploy/
          cp -r api deploy/
          rm -f deploy/api/config.php

      - name: Subir por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftp' }}
          local-dir: ./deploy/
          server-dir: ${{ vars.FTP_DIR || '/home/plansis/public_html/feddis/' }}
          exclude: |
            **/config.php
